[project]
name = "parallax-plane-detection"
version = "0.0.1"
description = "Pipeline for detecting flying aircraft in Sentinel-2 imagery using inter-band parallax effects, reimplementing Liu et al. (2020)."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Luca Vellage" },
]
requires-python = ">=3.11"
dependencies = [
    "earthengine-api>=1.7.24",
    "geemap>=0.37.2",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "geopandas>=1.1.3",
    "fiona>=1.10.1",
    "shapely>=2.1.2",
    "pyproj>=3.7.2",
    "rasterio>=1.4.4",
    "tifffile>=2026.3.3",
    "opencv-python>=4.12.0.88",
    "scipy>=1.17.1",
    "matplotlib>=3.10.8",
    "trino>=0.337.0",
    "python-dotenv>=1.2.2",
    "pydantic-settings>=2.7",
    "pyarrow>=24.0.0",
    "pillow>=12.1.1",
    "requests>=2.32.5",
    "sqlalchemy>=2.0",
    "geoalchemy2>=0.15",
    "psycopg2-binary>=2.9",
    "alembic>=1.13",
    "click>=8.1",
]

[project.optional-dependencies]
notebook = [
    "jupyterlab>=4.5.6",
    "ipywidgets>=8.1.8",
    "ipyleaflet>=0.20.0",
    "folium>=0.20.0",
]
test = [
    "pytest>=8.0",
]

[project.scripts]
parallax = "pipeline.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]